name: Welcome people from the OpenKaggle bench

on:
  issue_comment:
    types: [created]

concurrency:
  group: openkaggle-join-wall-${{ github.event.comment.id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  welcome:
    if: contains(github.event.issue.labels.*.name, 'join-wall')
    runs-on: ubuntu-latest
    steps:
      - name: Read the comment and welcome its author
        uses: actions/github-script@v7
        env:
          OPENKAGGLE_ORG_MEMBERS_TOKEN: ${{ secrets.OPENKAGGLE_ORG_MEMBERS_TOKEN }}
        with:
          github-token: ${{ secrets.OPENKAGGLE_ORG_MEMBERS_TOKEN }}
          script: |
            const org = 'OpenKaggle';
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const actor = comment.user;
            const marker = `<!-- openkaggle-join-wall:${comment.id} -->`;
            const body = (comment.body || '').trim();
            const normalized = body.replace(/\s+/g, ' ').toLowerCase();
            const joinPhrase = /^am i at the bench\?\s*(?:🦆)?$/u.test(normalized);
            const manualInvite = body.match(/^\/invite\s+@?([A-Za-z0-9-]{1,39})\s*$/i);
            const maintainer = ['OWNER', 'MEMBER'].includes(comment.author_association);

            async function reply(message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n${message}`,
              });
            }

            if (!actor || actor.type !== 'User' || actor.login.endsWith('[bot]')) return;

            // Let organizers leave the short phrase as a visual example without
            // producing an unnecessary bot reply or membership API call.
            if (joinPhrase && maintainer) return;

            let username;
            let source;
            if (manualInvite && maintainer) {
              username = manualInvite[1];
              source = 'a maintainer command';
            } else if (joinPhrase) {
              username = actor.login;
              source = 'your comment';
            } else {
              return;
            }

            if (username.endsWith('-')) {
              if (maintainer) await reply('That GitHub username is not valid. Please try the maintainer command again.');
              return;
            }

            if (!process.env.OPENKAGGLE_ORG_MEMBERS_TOKEN) {
              await reply('The bench is open, but the invitation service is not configured yet. An organizer has been notified.');
              core.setFailed('OPENKAGGLE_ORG_MEMBERS_TOKEN is not configured.');
              return;
            }

            try {
              const membership = await github.request('GET /orgs/{org}/memberships/{username}', { org, username });
              if (membership.data.state === 'active') {
                await reply(`@${username} is already part of OpenKaggle. Welcome back!`);
                return;
              }
              if (membership.data.state === 'pending') {
                await reply(`@${username} already has a pending OpenKaggle invitation. Please check GitHub notifications or email.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.request('PUT /orgs/{org}/memberships/{username}', {
                org,
                username,
                role: 'member',
              });
              await reply(`@${username}, you are on the bench — GitHub has sent an OpenKaggle membership invitation. Please accept it from your notifications or email.`);
            } catch (error) {
              const detail = String(error.message || error);
              if (/limit|rate|quota|abuse/i.test(detail)) {
                await reply(`@${username}, we saw ${source}, but GitHub's invitation capacity is full right now. No invitation was created; an organizer can retry later with \`/invite @${username}\`.`);
                return;
              }
              throw error;
            }
