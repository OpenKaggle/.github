name: Join OpenKaggle
description: Ask to join the OpenKaggle GitHub organization and help in public.
title: "[Join] "
labels:
  - join-request
  - needs-review
body:
  - type: markdown
    attributes:
      value: >-
        OpenKaggle is a small, open workbench for competition research and
        reproducible experiments. A complete form automatically starts an
        invitation for the account that opened this issue; GitHub still asks
        that account to accept it. Membership is optional: public issues and
        pull requests are open even if you do not join the organization.
        Welcome — this should take about a minute. You do not need a polished
        project, a repository, or an attachment to join.
  - type: dropdown
    id: interest
    attributes:
      label: How would you like to participate?
      options:
        - Share a competition notebook, tool, or research archive
        - Reproduce or review an existing OpenKaggle project
        - Help with documentation, tests, or provenance
        - Explore first and learn with the community
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: What would you like to bring?
      description: One sentence or a link is enough. Early ideas are welcome.
      placeholder: I would like to share or learn...
    validations:
      required: true
  - type: checkboxes
    id: agreements
    attributes:
      label: Before we send the invitation
      options:
        - label: I have read and will follow the Code of Conduct.
          required: true
        - label: I will not upload credentials, restricted competition data, or third-party material without permission.
          required: true
        - label: I understand that GitHub requires me to accept the invitation before membership becomes active.
          required: true
  - type: markdown
    attributes:
      value: >-
        **What happens next:** submit this form, wait for the automatic GitHub
        invitation, then click **Accept invitation** in GitHub notifications or
        the invitation email. If you only want to read or contribute publicly,
        you can stop here without joining. Please never paste passwords, API
        tokens, private competition files, or other people's restricted files.
