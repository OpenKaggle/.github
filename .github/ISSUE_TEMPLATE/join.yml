name: Join OpenKaggle
description: Ask to join the OpenKaggle GitHub organization and help in public.
title: "[Join] "
labels:
  - join-request
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        👋 **Welcome to OpenKaggle!**

        This takes about a minute. Bring an idea, a question, or simple
        curiosity — you do not need a polished project, repository, or file.

        🦆 Membership is optional. Public issues and pull requests are open to
        everyone, even if you do not join the organization.
  - type: dropdown
    id: interest
    attributes:
      label: How would you like to join the bench?
      options:
        - Share a competition notebook, tool, or research archive
        - Reproduce or review an existing OpenKaggle project
        - Help with documentation, tests, or provenance
        - Explore first and learn with the community
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: What would you like to try or share?
      description: One sentence or a link is enough — early ideas are welcome.
      placeholder: I would like to try or share...
    validations:
      required: true
  - type: checkboxes
    id: agreements
    attributes:
      label: A quick promise to the community
      options:
        - label: I have read and will follow the Code of Conduct.
          required: true
        - label: I will not upload credentials, restricted competition data, or third-party material without permission.
          required: true
        - label: I understand that GitHub requires me to accept the invitation before membership becomes active.
          required: true
  - type: markdown
    attributes:
      value: |
        ✨ **What happens next**

        Submit the form → watch GitHub notifications → click **Accept
        invitation**. GitHub may also send an invitation email.

        No upload is needed. Please keep passwords, API tokens, private
        competition files, and other people's restricted files out of this
        issue.
